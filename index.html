<style>
:root{color-scheme:dark;--bg:#101727;--panel:#182233;--line:#334154;--ink:#f2f6ff;--muted:#9cadc4;--blue:#63a8fa}
*{box-sizing:border-box}
body{margin:0;padding:18px;color:var(--ink);background:var(--bg);font:14px/1.55 "Microsoft YaHei UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0} h1{font-size:25px} h2{font-size:18px} h3{font-size:15px}
header,.heading,.selectors,.summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header,.heading{justify-content:space-between} header p,.muted,small{color:var(--muted)}
button,select,input{font:inherit} button,select,input[type=number],input[type=text]{border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:8px 11px}
button,select,summary,label:has(input[type=radio]){cursor:pointer} button:hover{border-color:var(--blue)} button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.primary{background:var(--blue);color:#0b1729;border-color:var(--blue)} .outline{color:#8fbeff;border-color:#346ab1}

.panel{border:1px solid var(--line);margin-top:54px;padding:22px}
.selectors{margin:14px 0 22px}.content{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,1fr);gap:22px}
.chart-side,.results{min-width:0}.results{padding-left:22px;border-left:1px solid var(--line)}
.summary{justify-content:center;margin:12px 0 4px;font-weight:600} canvas{display:block;width:100%;height:clamp(260px,40vw,550px)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}
.metrics div{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px}.metrics strong{display:block}
table{border-collapse:collapse;width:100%;margin-top:12px} th,td{padding:8px;border:1px solid var(--line)} th{background:var(--panel);font-weight:600} td:last-child,th:last-child{text-align:right} td:nth-child(2){font-family:Georgia,serif}
dialog{width:min(480px,calc(100% - 32px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:20px} dialog::backdrop{background:#060911bb} form label{display:block;margin:12px 0} form input{width:100%} .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

@media(max-width:480px){body{padding:12px}.panel{padding:12px}.summary{justify-content:flex-start}}
</style>
<style>
.panel{margin-top:20px}.content{grid-template-columns:minmax(0,1.8fr) minmax(330px,1fr);align-items:start}canvas{height:clamp(230px,27vw,390px)}#spec-chart{height:230px}
.chart-block{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.legend{display:flex;flex-wrap:wrap;gap:7px 12px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:14px;border-top:2px solid var(--swatch);vertical-align:middle;margin-right:5px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin:8px 0}.details div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding:6px 0;font-size:12px}.details dt{color:var(--muted)}.details dd{margin:0;text-align:right}
.notice,details{color:var(--muted);font-size:12px;margin:8px 0}.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tools button{font-size:12px;padding:5px 8px}
@media(max-width:900px){.content{grid-template-columns:1fr}}@media(max-width:480px){.details{grid-template-columns:1fr}th,td{padding:6px}}
</style>
<style>.limits{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:9px;align-items:end;margin:12px 0}.limits label{position:relative;margin:0;color:var(--muted);font-size:12px}.limits input{display:block;margin-top:5px;padding-right:39px}.limits label::after{content:attr(data-unit);position:absolute;right:10px;bottom:9px;pointer-events:none}.limits input::-webkit-inner-spin-button{appearance:none}.info{color:var(--muted);font-size:12px;cursor:help}.chart-meta{color:var(--muted);font-size:12px;text-align:center;margin:0 0 6px}.summary{margin-top:6px}.results>.chart-block{margin-top:17px}@media(max-width:420px){.limits{grid-template-columns:1fr 1fr}.limits button{grid-column:1/-1}}</style>
<style>

.board-list{display:grid;gap:7px;max-height:700px;overflow:auto;margin-top:12px;padding-right:3px}
.board-card{margin:0;border:1px solid #2e3c51;border-radius:5px;background:#141f30}.board-card summary{color:var(--ink);padding:8px 10px}.board-card[open] summary{border-bottom:1px solid #2e3c51}
.board-body{padding:9px 10px}.board-body label{color:var(--ink)}.board-body dl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-bottom:0}.board-body dd{margin:0;text-align:right;color:var(--ink)}
.chart-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{padding:6px 10px;border-color:transparent;background:transparent;color:var(--muted)}.tabs button[aria-pressed=true]{color:#eef5ff;background:#21344f;border-color:#405c81}
.unit-control{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.unit-control select{min-width:0;padding:5px 7px}
.trend-group-control{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;white-space:nowrap;color:var(--muted)}
.analysis-controls>#export-images{margin-left:auto}
#trend-size,#trend-mode{border:0;background:transparent;color:var(--ink)}
#trend-size{width:7ch;padding-inline:5px}
#trend-mode{padding-left:5px;border-left:1px solid var(--line);border-radius:0}
.board-filter{display:grid;gap:5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.board-filter label{font-size:12px;color:var(--muted)}.board-filter select{width:100%;min-width:0;padding:5px 8px}.board-filter #filter-extra:empty{display:none}
.chart-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.chart-actions button{padding:5px 10px;font-size:12px}
.chart-stack{display:grid;gap:10px}.chart-card{display:grid;grid-template-rows:auto minmax(0,1fr) 36px;height:clamp(265px,calc((100vh - 215px)/2),475px);padding:11px 11px 5px;border:1px solid #2a394e;border-radius:6px;background:#101727}
.chart-card h2{font-size:15px}.chart-card canvas,.chart-card #spec-chart{height:100%;width:100%;min-height:0}.chart-card .legend{align-content:center;overflow:auto}
.results th[scope=rowgroup]{color:var(--muted);background:#111a2a}
.results .cpk-result>*{background:#20314a;font-weight:650}
.results table th:first-child{text-align:left}.results table td:nth-child(2){font-family:inherit}.extra-tools{border-top:1px solid var(--line);padding-top:6px;margin-top:12px}@media(max-width:1050px){.workspace{grid-template-columns:minmax(160px,.65fr) minmax(0,2.2fr)}.workspace .results{grid-column:2}}
@media(max-width:650px){.workspace{grid-template-columns:minmax(0,1fr)}.workspace .results{grid-column:auto}.board-list{max-height:245px}.chart-card{height:280px}}
</style>
<style>
body{padding-left:218px}.app-nav{position:fixed;inset:0 auto 0 0;width:200px;background:#1b2639;padding:18px 10px;border-right:1px solid #29374b;overflow:auto}.nav-mark{font-size:28px;line-height:1;color:#a5b6cf;margin:2px 10px 36px}.app-nav h2{font-size:12px;color:#9aacbf;margin:0 10px 10px}.nav-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:5px;color:#b9c8dd;font-size:14px}.nav-item i{width:19px;color:#8196b1;text-align:center;font-style:normal}.nav-item[aria-current]{background:#101727;color:#fff}.nav-item[aria-current] i{color:#62a7ff}

@media(max-width:730px){body{padding:12px}.app-nav{position:static;width:auto;display:flex;gap:4px;align-items:center;margin-bottom:12px;padding:5px;overflow:auto}.app-nav .nav-mark,.app-nav h2{display:none}.nav-item{white-space:nowrap;padding:6px}.nav-item i{display:none}}

<style>

<style>

<style>

<style>
[hidden]{display:none!important}.cpk-link{text-decoration:none}.cpk-link i{flex-shrink:0}.source-fields select,#aoi-scope select,#aoi-scope input{width:100%;min-width:0}.date-range{display:grid;gap:4px}.date-range input{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px}
.analysis-controls{border-bottom:1px solid var(--line);padding-bottom:7px}.trend-card{height:clamp(270px,44vh,450px)}.trend-card input{width:85px}.trend-card select{min-width:0}#trend-results{max-height:350px;overflow:auto}#trend-results button{padding:3px 6px}#trend-results .selected-group{background:#21344f}

<style>
.query-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-top:13px;padding:5px 14px;background:#111a2a;border:1px solid var(--line);border-radius:7px}

.workspace{margin-top:12px}.board-empty{color:var(--muted);font-size:12px}.chart-card{height:clamp(265px,calc((100vh - 283px)/2),475px)}.chart-card.trend-card{grid-template-rows:minmax(0,1fr);height:clamp(270px,44vh,450px)}

<style>

<style>

<header>

        <label for="date-to">结束时间 <input id="date-to" type="datetime-local" aria-label="检测开始时间范围终点"></label>

<script>
const byId = id => document.getElementById(id);
const fmt = (value, digits = 3) => Number.isFinite(value) ? value.toFixed(digits) : '—';
const params=new URLSearchParams(location.search);
const isAOI=params.get('mode')==='aoi', central=params.get('scope')==='central';
const metrics = isAOI?{
  x:{name:'X偏移',unit:'µm',lo:-60,hi:60,target:0},
  y:{name:'Y偏移',unit:'µm',lo:-60,hi:60,target:0},
  angle:{name:'角度',unit:'°',lo:-5,hi:5,target:0}
}:{
  height:{name:'高度',unit:'%',physical:'µm',lo:60,hi:160,target:100},
  area:{name:'面积',unit:'%',physical:'µm²',lo:60,hi:100,target:100},
  volume:{name:'体积',unit:'%',physical:'µm³',lo:60,hi:160,target:100},
  x:{name:'X偏移',unit:'µm',lo:-60,hi:60,target:0},
  y:{name:'Y偏移',unit:'µm',lo:-60,hi:60,target:0}
};
const state = {key:isAOI?'x':'area',filter:0,view:'distribution',activeGroup:null};
function activeWindow(){
  if(state.view!=='trend')return undefined;
  return trendGroups()[state.activeGroup]?.boards??[];
}
function stats(){return simulatedStats(activeWindow());}
function calculations(data,{lo,hi}) {
  const cpu=(hi-data.mean)/(3*data.within),cpl=(data.mean-lo)/(3*data.within);
  return {cpu,cpl,cp:(hi-lo)/(6*data.within),cpk:Math.min(cpu,cpl)};
}
function plot(canvas,data,options={}) {
  const width = canvas.clientWidth, height = canvas.clientHeight;
  if (!width || !height) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width*dpr; canvas.height = height*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const left=47, right=width-12, top=26, bottom=height-42;
  if(right<=left||bottom<=top)return;
  const xMin=options.min ?? ((data.bins[0]?.x ?? 0)-data.width/2);
  const xMax=options.max ?? ((data.bins.at(-1)?.x ?? 10)+data.width/2);
  const peak=Math.max(1,...data.bins.map(b=>b.count));
  const step=peak>=500?200:peak>=100?50:peak>=20?10:2;
  const yMax=Math.ceil(peak/step)*step;
  const x=v=>left+(v-xMin)/(xMax-xMin)*(right-left);
  const y=v=>bottom-v/yMax*(bottom-top);
  ctx.font='12px system-ui'; ctx.fillStyle='#a9b8cc'; ctx.textAlign='right';
  function line(x1,y1,x2,y2,color) {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=color; ctx.stroke();
  }
  for(let i=0;i<=5;i++){
    const value=Math.round(yMax*i/5);
    line(left,y(value),right,y(value),'#2a3547');
    ctx.fillText(value.toLocaleString('zh-CN'),left-7,y(value)+4);
  }
  ctx.fillStyle='#4082ed';
  const bar=(x(data.width)-x(0))*.55;
  for(const bin of data.bins) ctx.fillRect(x(bin.x)-bar/2,y(bin.count),bar,bottom-y(bin.count));
  ctx.fillStyle='#a9b8cc';ctx.textAlign='center';
  const ticks=options.ticks ?? Array.from({length:5},(_,i)=>xMin+(xMax-xMin)*(i+.5)/5);
  for(const value of ticks) ctx.fillText(fmt(value, xMax-xMin<25?1:0),x(value),bottom+16);
  ctx.fillText(options.xLabel,(left+right)/2,height-5);
  ctx.textAlign='left';
  ctx.fillText('样本数（条）',4,13);
  ctx.textAlign='center';
  if(!data.n) ctx.fillText('暂无该参数的测量样本',(left+right)/2,(top+bottom)/2);
  if(options.overlay) options.overlay(ctx,{x,y,left,right,top,bottom,xMin,xMax,line});
}
function showScope(title, body) {
  byId('scope-content').innerHTML='<h2>'+title+'</h2><p class="muted">'+body+'</p>';
  byId('scope-dialog').showModal();
}
function render() {
  if(state.view==='trend'){
    const groups=trendGroups();
    if(state.activeGroup===null||!groups[state.activeGroup]){
      state.activeGroup=groups.length?0:null;
    }
  }
  const source=metrics[state.key], raw=stats();
  const physical=source.unit==='%'&&byId('unit').value==='physical'&&source.nominal>0;
  const factor=physical?source.nominal/100:1;
  const metric={...source,unit:physical?source.physical:source.unit,lo:source.lo*factor,hi:source.hi*factor,target:source.target*factor};
  const data={...raw,mean:raw.mean*factor,s:raw.s*factor,within:raw.within*factor,min:raw.min*factor,max:raw.max*factor,width:raw.width*factor,bins:raw.bins.map(bin=>({...bin,x:bin.x*factor}))};
  const result=calculations(data,metric);
  const rows=[
    ['S','S = √(Σ(xᵢ − x̄)² / (n − 1))',data.s],
    ['SW','多测点：板内合并标准差；单测点：相邻板移动极差均值 / 1.128',data.within],
    ['Cpu','Cpu = (USL − x̄) / (3 × σwithin)',result.cpu],
    ['Cpl','Cpl = (x̄ − LSL) / (3 × σwithin)',result.cpl],
    ['Cp','Cp = (USL − LSL) / (6 × σwithin)',result.cp],
    ['Cpk','Cpk = min(Cpu, Cpl)',result.cpk],
  ];
  byId('results').innerHTML='<tr><th colspan="2" scope="rowgroup">制程能力</th></tr>'+
    rows.map(([name,formula,value])=>`<tr${name==='Cpk'?' class="cpk-result"':''}><th scope="row">${help(translations[name]+"（"+name+"）",formula)}</th><td>${fmt(value)}</td></tr>`).join('');
  const focusRef=isAOI&&state.filter===2&&state.activeRef?state.activeRef+' · ':'';
  for(const [id,suffix] of [['histogram','分布'],['spec-chart','与规格上下限']]){
    const chart=byId(id),title=focusRef+metric.name+suffix;
    chart.setAttribute('aria-label',title);
    chart.previousElementSibling.textContent=title;
  }
  byId('trend-chart').setAttribute('aria-label',focusRef+'Cpk趋势图');
  byId('cpk-title').textContent=focusRef+'制程能力指标';
  renderExtended(data,metric,result,source);
  if(state.view==="trend")renderTrend();
  // EXTENDED_RENDER
}
byId('parameters').onclick=event=>{
  const tab=event.target.closest('button[data-metric]');
  if(!tab)return;
  state.key=tab.dataset.metric;syncLimits();render();
};
function scaleFor(metric){
  return metric.unit==='%'&&byId('unit').value==='physical'&&metric.nominal?metric.nominal/100:1;
}
function syncLimits(){
  const metric=metrics[state.key];renderTabs(metric);
  const factor=scaleFor(metric);
  byId('upper').setCustomValidity('');
  byId('lower').value=+(metric.lo*factor).toFixed(8);
  byId('upper').value=+(metric.hi*factor).toFixed(8);
  const unit=metric.unit==='%'&&byId('unit').value==='physical'?metric.physical:metric.unit;
  for(const id of ['lower','upper']) byId(id).parentElement.dataset.unit=unit;
}
byId('limits').onsubmit=event=>{
  event.preventDefault();
  const lo=byId('lower').valueAsNumber,hi=byId('upper').valueAsNumber;
  if(lo>=hi){byId('upper').setCustomValidity('上限必须大于下限');byId('upper').reportValidity();return;}
  const metric=metrics[state.key],factor=scaleFor(metric);
  Object.assign(metric,{lo:lo/factor,hi:hi/factor});render();
};
for(const id of ['lower','upper'])byId(id).oninput=()=>byId('upper').setCustomValidity('');
const example=isAOI?{x:[-3,8],y:[2,7],angle:[.25,.55]}:{height:[108,5,80],area:[94.329,3.298,131837.36],volume:[91,6,10546988.68],x:[-3.5,4],y:[1,3]};
for(const [key,[,,nominal]] of Object.entries(example)) metrics[key].nominal=nominal;
let seed=20261117;
function uniform(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return (seed+.5)/4294967296;}
const boardSize=isAOI?12:2924;
const boards=Array.from({length:isAOI?250:12},(_,i)=>'模拟板卡 '+String(i+1).padStart(3,'0'));
const boardInterval=(isAOI?3:45)*60000;
const startTime=Date.now()-60000-(boards.length-1)*boardInterval;
const boardInfo=new Map(boards.map((id,i)=>[id,{id,time:startTime+i*boardInterval,device:(isAOI?'AOI':'SPI')+(central&&i>=boards.length/2?'-02':'-01'),model:isAOI?'AOI-DEMO':'SPI-DEMO'}]));
const catalog=Array.from({length:12},(_,i)=>{
  const type=i<4?0:i<8?1:2;
  return {ref:['R','C','U'][type]+(i%4+1),package:['0402','0603','QFN-32'][type],part:['RES-10K','CAP-100N','IC-CTRL'][type]};
});
const demo=Array.from({length:boards.length*boardSize},(_,index)=>{
  const i=index%boardSize,boardIndex=Math.floor(index/boardSize);
  const row={board:boards[boardIndex],pad:String(i+1).padStart(4,'0'),group:i<1462?'A 组':'B 组'};
  if(isAOI)Object.assign(row,catalog[i]);
  for(const [key,[mean,s]] of Object.entries(example)){
    const z=Math.sqrt(-2*Math.log(uniform()))*Math.cos(2*Math.PI*uniform());
    row[key]=+(mean+(boardIndex%5-2)*.35+s*z).toFixed(2);
  }
  return row;
});
function help(label,abbr){
  return label+(abbr?' <span class="info" tabindex="0" title="'+abbr+'" aria-label="'+abbr+'">ⓘ</span>':'');
}
function renderTabs(metric){
  const unit=byId('unit'), offset=metric.unit!=='%';
  const fixed=byId('fixed-unit');
  fixed.hidden=!offset;
  unit.hidden=offset;
  if(offset){
    fixed.textContent=metric.unit==='°'?'度 (°)':'微米 (µm)';
    unit.replaceChildren(new Option(fixed.textContent,'offset'));
    unit.disabled=true;
  }else if(unit.disabled||unit.options.length!==2){
    unit.replaceChildren(new Option('百分比 (%)','percent'),new Option(metric.physical,'physical'));
    unit.disabled=false;
  }else unit.options[1].textContent=metric.physical;
  for(const tab of byId('parameters').children){
    tab.setAttribute('aria-pressed',String(tab.dataset.metric===state.key));
  }
}
const translations={SW:'短期标准差',S:'样本标准差',Cpu:'上侧能力指数',Cpl:'下侧能力指数',Cp:'制程潜在能力',Cpk:'制程能力指数',Mean:'平均值',LCL:'控制下限',UCL:'控制上限',LSL:'规格下限',USL:'规格上限',Target:'目标值'};
const labels={
  mean:['Mean','#79ddbf'],
  lcl:['LCL','#49d9ff'],
  ucl:['UCL','#bc92ff'],
  lo:['LSL','#ff9f43'],
  hi:['USL','#ff6fa8'],
  target:['Target','#c7cbd5'],
  normal:['正态拟合','#ffe45e']
};
const countText=value=>Number.isFinite(value)?String(value):'—';
function details(id,entries){
  const list=byId(id);list.replaceChildren();
  for(const [label,value,color] of entries){
    const row=document.createElement('div'), term=document.createElement('dt'), item=document.createElement('dd');
    const [abbr,name]=label.split(" · ");term.textContent=name?name+"（"+abbr+"）":id==="details"&&translations[abbr]?translations[abbr]+"（"+abbr+"）":abbr;item.textContent=value;
    if(color)term.style.setProperty("--reference-color",color);
    row.append(term,item);list.append(row);
  }
}
function sourceBoards(){
  const {device,model,from,to}=state.query;
  const fromTime=from?new Date(from).getTime():-Infinity;
  const toTime=to?new Date(to).getTime():Infinity;
  return boards.filter(id=>{
    const b=boardInfo.get(id);
    return b.device===device&&b.model===model&&b.time>=fromTime&&b.time<=toTime;
  });
}
function simulatedStats(windowBoards){
  const ids=new Set(windowBoards??sourceBoards());
  let selected=demo.filter(row=>ids.has(row.board));
  if(isAOI){
    if(state.filter===2)selected=selected.filter(row=>row.ref===state.activeRef);
    if(state.filter===1)selected=selected.filter(row=>row[state.group.key]===state.group.value);
  }else{
    if(state.filter===1)selected=selected.filter(row=>row.group===state.group);
    if(state.filter===2)selected=selected.filter(row=>state.pads.has(row.pad));
  }
  const values=selected.map(row=>row[state.key]).filter(Number.isFinite);
  const n=values.length;
  if(!n)return {bins:[],n,width:2,selected};
  const min=values.reduce((a,b)=>Math.min(a,b)),max=values.reduce((a,b)=>Math.max(a,b));
  const mean=values.reduce((a,b)=>a+b,0)/n;
  const s=n>1?Math.sqrt(values.reduce((sum,v)=>sum+(v-mean)**2,0)/(n-1)):NaN;
  const size=Math.min(26,Math.ceil(Math.sqrt(n))), width=(max-min||1)/size;
  const start=min===max?min-.5:min;
  const bins=Array.from({length:size},(_,i)=>({x:start+(i+.5)*width,count:0}));
  for(const value of values) bins[Math.min(size-1,Math.max(0,Math.floor((value-start)/width)))].count++;
  const perBoard=new Map();
  for(const row of selected){
    if(!Number.isFinite(row[state.key]))continue;
    if(!perBoard.has(row.board))perBoard.set(row.board,[]);
    perBoard.get(row.board).push(row[state.key]);
  }
  let variance=0,df=0;
  for(const samples of perBoard.values()){
    if(samples.length<2)continue;
    const avg=samples.reduce((sum,v)=>sum+v,0)/samples.length;
    variance+=samples.reduce((sum,v)=>sum+(v-avg)**2,0);df+=samples.length-1;
  }
  const ranges=[...perBoard.values()];
  const estimated=df?Math.sqrt(variance/df):ranges.length>1
    ?ranges.slice(1).reduce((sum,v,i)=>sum+Math.abs(v[0]-ranges[i][0]),0)/(ranges.length-1)/1.128:NaN;
  const within=estimated>0?estimated:NaN;
  return {values,min,max,mean,s,within,n,bins,width};
}
function outsideCount(data,metric,factor){
  if(!data.n)return NaN;
  return data.values.filter(v=>v*factor<metric.lo||v*factor>metric.hi).length;
}
function drawDistribution(id,legendId,data,refs,keys,metric){
  const values=keys.map(key=>refs[key]).filter(Number.isFinite);
  const left=data.bins.length?data.bins[0].x-data.width/2:Math.min(...values);
  const right=data.bins.length?data.bins.at(-1).x+data.width/2:Math.max(...values);
  const min=Math.min(left,...values),max=Math.max(right,...values),pad=(max-min||1)*.045;
  const used=keys.filter(key=>Number.isFinite(refs[key]));
  const showCurve=data.n>1 && data.s>0;
  byId(legendId).innerHTML=[...used.map(key=>labels[key]),...(showCurve?[labels.normal]:[])].map(([label,color])=>'<span><i style="--swatch:'+color+'"></i>'+(translations[label]?translations[label]+'（'+label+'）':label)+'</span>').join('');
  plot(byId(id),data,{xLabel:metric.name+'（'+metric.unit+'）',min:Number.isFinite(min)?min-pad:undefined,max:Number.isFinite(max)?max+pad:undefined,overlay(ctx,axes){
    const {x,y,left,right,top,bottom,xMin,xMax,line}=axes;
    ctx.save();ctx.beginPath();ctx.rect(left,top,right-left,bottom-top);ctx.clip();
    for(const key of used){
      const pos=x(refs[key]);
      ctx.setLineDash(key==='target'?[3,4]:key==='lcl'||key==='ucl'?[7,4]:[]);
      line(pos,top,pos,bottom,labels[key][1]);
    }
    ctx.setLineDash([]);
    if(showCurve){
      ctx.beginPath();
      for(let i=0;i<=180;i++){
        const value=xMin+(xMax-xMin)*i/180;
        const expected=data.n*data.width*Math.exp(-.5*((value-data.mean)/data.s)**2)/(data.s*Math.sqrt(2*Math.PI));
        if(i===0)ctx.moveTo(x(value),y(expected));else ctx.lineTo(x(value),y(expected));
      }
      ctx.strokeStyle=labels.normal[1];ctx.lineWidth=1.7;ctx.stroke();
    }
    ctx.restore();
  }});
}
let current;
function renderExtended(data,metric,result,source){
  const physical=metric.unit!==source.unit, factor=physical?source.nominal/100:1;
  const out=outsideCount(data,metric,factor);
  const sampleRows=[

function makePadMap(){
  const half=[];
  function grid(x,y,columns,rows,dx,dy,w,h){
    for(let j=0;j<rows;j++)for(let i=0;i<columns;i++)half.push({x:x+i*dx,y:y+j*dy,w,h,angle:0});
  }
  grid(48,62,9,4,11,15,6,7);grid(176,60,17,7,7,8,4,4);
  grid(324,57,23,5,7,8,4,4);grid(485,122,4,23,9,8,5,5);
  grid(52,166,5,4,12,19,8,4);grid(194,140,9,14,8,8,4,4);grid(335,135,12,12,6,6,3.8,3.8);
  grid(53,290,5,4,18,12,12,7);grid(54,369,14,15,6,6,3.5,3.5);
  grid(158,343,4,20,9,8,4,4);grid(55,488,8,3,13,10,9,5);grid(62,545,6,13,8,7,4,4);
  grid(160,545,21,4,8,10,4,5);grid(178,611,35,2,8,10,4,5);
  const center={x:343,y:382};
  for(const radius of [115,144]){
    for(let i=0;i<72;i++){
      const a=i*Math.PI/36;
      half.push({x:center.x+radius*Math.cos(a),y:center.y+radius*Math.sin(a),w:5,h:4,angle:a});
    }
  }
  for(let side=0;side<4;side++){
    const a=Math.PI/4+side*Math.PI/2;
    for(let i=-12;i<=12;i++){
      const t=i*6.2;
      half.push({x:center.x+80*Math.cos(a)-t*Math.sin(a),y:center.y+80*Math.sin(a)+t*Math.cos(a),w:9,h:3,angle:a});
    }
  }
  return [0,1].flatMap(side=>half.map((pad,i)=>({...pad,x:pad.x+side*568,id:String(side*1462+i+1).padStart(4,'0')})));
}

function makeRefNode(name,children=[]){

function syncRefChoices(){
  const query=byId('pad-ref-search').value.trim().toUpperCase();
  const selectedOnly=byId('pad-ref-selected').checked;
  const filterKey=JSON.stringify([query,selectedOnly]);
  function update(node,ancestorMatches){
    const matches=ancestorMatches||node.name.toUpperCase().includes(query);
    const count=node.refs.filter(ref=>draft.has(ref)).length;
    node.checkbox.checked=count===node.refs.length;
    node.checkbox.indeterminate=count>0&&!node.checkbox.checked;
    const visible=node.children.length
      ?node.children.map(child=>update(child,matches)).some(Boolean)
      :matches&&(!selectedOnly||count>0);
    node.element.hidden=!visible;
    if(node.childList){
      if(node.filterKey!==filterKey){
        node.filterKey=filterKey;
        node.filterExpanded=true;
      }
      const showChildren=query||selectedOnly?node.filterExpanded:node.expanded;
      node.childList.hidden=!showChildren;
      node.toggle.setAttribute('aria-expanded',String(showChildren));
    }
    return visible;
  }

byId('query-form').onsubmit=event=>{
  event.preventDefault();
  const [device,model,from,to]=queryValues();
  const exact=deviceIds.find(id=>id.toLowerCase()===device.toLowerCase());
  const matches=exact?[exact]:deviceIds.filter(id=>id.toLowerCase().includes(device.toLowerCase()));
  if(matches.length!==1){
    deviceInput.setCustomValidity(matches.length?'请选择一个设备编号':'未找到匹配的设备编号');
    deviceInput.reportValidity();return;
  }
  if(!validateRange(from,to))return;
  updateRangeSummary();byId('range-picker').open=false;
  deviceInput.value=matches[0];applyQuery(matches[0],model,from,to);
};
function clearQueryErrors(){
  deviceInput.setCustomValidity('');byId('date-to').setCustomValidity('');
}
for(const id of ['device','date-from','date-to'])byId(id).oninput=clearQueryErrors;
byId('query-reset').onclick=()=>{
  clearQueryErrors();deviceInput.value=deviceIds[0];byId('model').selectedIndex=0;
  byId('range-preset').value='24h';syncRangePicker();
  byId('date-from').value='';byId('date-to').value='';
  updateRangeSummary();byId('range-picker').open=false;
  applyQuery(...queryValues());
};
function trendGroups(){
  const ids=sourceBoards();
  const mode=byId('trend-mode').value;
  const n=Math.max(1,Math.min(10000,Math.floor(Number(byId('trend-size').value)||1)));
  const origin=ids.length?boardInfo.get(ids[0]).time:0, groups=new Map();
  ids.forEach((id,i)=>{
    const key=mode==='hours'?Math.floor((boardInfo.get(id).time-origin)/(n*3600000)):Math.floor(i/n);
    if(!groups.has(key))groups.set(key,{boards:[]});
    groups.get(key).boards.push(id);
  });
  return [...groups.values()];
}
function renderTrend(){
  const output=byId('trend-rows');output.replaceChildren();
  const source=metrics[state.key];
  const groups=trendGroups().map((group,index)=>{
    const data=simulatedStats(group.boards),result=calculations(data,source);
    const row=document.createElement('tr');
    if(index===state.activeGroup)row.className='selected-group';
    const first=boardInfo.get(group.boards[0]),last=boardInfo.get(group.boards.at(-1));
    const clock=b=>{
      const d=new Date(b.time), pad=v=>String(v).padStart(2,'0');
      return '<time>'+d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(pad).join(':')+'</time>';
    };
    row.innerHTML='<td><button type="button">第 '+(index+1)+' 组</button></td><td>'+clock(first)+(first===last?'':' – '+clock(last))+'</td><td>'+group.boards.length+'</td><td>'+data.n+'</td><td>'+fmt(result.cpk)+'</td>';
    row.querySelector('button').onclick=()=>{state.activeGroup=index;render();};
    output.append(row);
    return result.cpk;
  });
  drawTrend(groups);
}
let trendZoom=1;
function resetTrendZoom(){
  trendZoom=1;
  byId('trend-viewport').scrollLeft=0;
}
function drawTrend(groups){
  const viewport=byId('trend-viewport'),canvas=byId('trend-chart');
  const baseWidth=viewport.clientWidth;
  if(!baseWidth||!viewport.clientHeight)return;
  const dpr=window.devicePixelRatio||1;
  const maxZoom=groups.length>1?Math.max(1,Math.min(12,8192/(baseWidth*dpr))):1;
  trendZoom=Math.min(trendZoom,maxZoom);
  const w=Math.round(baseWidth*trendZoom);
  canvas.style.width=w+'px';
  const h=viewport.clientHeight;
  canvas.style.height=h+'px';
  canvas.width=w*dpr;canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const values=groups.filter(Number.isFinite);
  const lo=Math.min(0,...values),hi=Math.max(1,...values);
  ctx.font='12px system-ui';
  const ticks=Array.from({length:5},(_,i)=>lo+(hi-lo)*i/4);
  const left=Math.max(42,...ticks.map(value=>ctx.measureText(fmt(value,2)).width+12)),right=w-20,top=26,bottom=h-42;
  if(right<=left||bottom<=top)return;
  const x=i=>groups.length>1?left+(right-left)*i/(groups.length-1):(left+right)/2;
  const y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);
  ctx.fillStyle='#a9b8cc';
  for(const v of ticks){
    ctx.strokeStyle='#2a3547';ctx.beginPath();ctx.moveTo(left,y(v));ctx.lineTo(right,y(v));ctx.stroke();ctx.fillText(fmt(v,2),2,y(v)+4);
  }
  ctx.fillText('Cpk',4,13);
  ctx.textAlign='center';
  const tickCount=Math.min(groups.length,Math.max(2,Math.floor((right-left)/48)));
  for(let i=0;i<tickCount;i++){
    const index=tickCount===1?0:Math.round(i*(groups.length-1)/(tickCount-1));
    ctx.fillText(String(index+1),x(index),bottom+16);
  }
  ctx.fillText('组别（按检测时间排序）',(left+right)/2,h-5);
  ctx.textAlign='left';
  ctx.strokeStyle='#63a8fa';
  ctx.fillStyle=ctx.strokeStyle;
  ctx.lineWidth=2;
  ctx.beginPath();
  let previous=false;
  groups.forEach((value,i)=>{
    if(!Number.isFinite(value)){previous=false;return;}
    if(previous)ctx.lineTo(x(i),y(value));else ctx.moveTo(x(i),y(value));
    previous=true;
  });
  ctx.stroke();
  groups.forEach((value,i)=>{
    if(!Number.isFinite(value))return;
    ctx.beginPath();
    ctx.arc(x(i),y(value),i===state.activeGroup?5:2.5,0,Math.PI*2);
    ctx.fill();
  });
  if(!values.length){ctx.fillStyle='#a9b8cc';ctx.fillText('当前分组数据不足，无法计算能力指数',left,top+22);}
  viewport.onwheel=event=>{
    if(event.ctrlKey||event.shiftKey||Math.abs(event.deltaX)>Math.abs(event.deltaY)||!event.deltaY)return;
    const amount=event.deltaMode===1?event.deltaY*16:event.deltaMode===2?event.deltaY*120:event.deltaY;
    const next=Math.max(1,Math.min(maxZoom,trendZoom*Math.exp(-amount*.002)));
    if(next===trendZoom)return;
    event.preventDefault();
    const pointer=event.clientX-viewport.getBoundingClientRect().left;
    const position=Math.max(0,Math.min(1,(viewport.scrollLeft+pointer-left)/(right-left)));
    trendZoom=next;
    drawTrend(groups);
    viewport.scrollLeft=left+position*(canvas.clientWidth-20-left)-pointer;
  };
  canvas.onclick=event=>{
    if(!groups.length)return;
    const position=event.clientX-canvas.getBoundingClientRect().left;
    const i=Math.max(0,Math.min(groups.length-1,Math.round((position-left)/(right-left)*(groups.length-1))));
    state.activeGroup=i;
    render();
    scrollToActiveGroup();
  };
}
function scrollToActiveGroup(){
  const list=byId('trend-results');
  const row=byId('trend-rows').rows[state.activeGroup];
  const header=list.querySelector('thead');
  if(row&&header){
    const headerBottom=header.rows[0].getBoundingClientRect().bottom;
    list.scrollTop+=row.getBoundingClientRect().top-headerBottom;
  }
}
byId('analysis-tabs').onclick=event=>{
  const tab=event.target.closest('[data-view]');if(!tab)return;
  state.view=tab.dataset.view;
  const trend=state.view==='trend';
  byId('trend-detail-tools').hidden=!trend;
  byId('distributions').hidden=trend;byId('trend-panel').hidden=!trend;byId('trend-results').hidden=!trend;
  for(const button of byId('analysis-tabs').children)button.setAttribute('aria-pressed',String(button===tab));
  render();
  if(trend)scrollToActiveGroup();
};
const trendSize={boards:1,hours:1};
byId('trend-mode').onchange=()=>{
  const mode=byId('trend-mode').value;
  byId('trend-size').value=trendSize[mode];
  resetTrendZoom();
  state.activeGroup=null;render();
};
byId('trend-size').onchange=()=>{
  const input=byId('trend-size');
  input.value=Math.max(1,Math.min(10000,Math.floor(Number(input.value)||1)));
  trendSize[byId('trend-mode').value]=Number(input.value);
  resetTrendZoom();
  state.activeGroup=null;render();
};
const [device,model,from,to]=queryValues();
state.query={device,model,from,to};
renderBoards();syncLimits();
const navToggle=byId('nav-toggle');
navToggle.onclick=()=>{
  const collapsed=document.body.classList.toggle('nav-collapsed');
  navToggle.setAttribute('aria-expanded',String(!collapsed));
  const label=collapsed?'展开菜单栏':'折叠菜单栏';
  navToggle.setAttribute('aria-label',label);navToggle.title=label;
  render();
};
function syncBoardPanelHeight(){
  const workspace=document.querySelector('.workspace');
  const top=workspace.getBoundingClientRect().top+window.scrollY;
  workspace.style.setProperty('--board-top',top+'px');
}
const queryLayout=new ResizeObserver(syncBoardPanelHeight);
queryLayout.observe(byId('query-form'));
window.addEventListener('resize',()=>{syncBoardPanelHeight();render();});
syncBoardPanelHeight();
render();
</script>
</body>
